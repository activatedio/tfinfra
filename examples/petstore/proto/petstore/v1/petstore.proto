// Petstore is the toy API surface used as tfinfra's golden example. It
// exercises every field shape the generator supports. One message, Kennel,
// carries a shape the generator refuses, so the genlib tests can reach it
// through a real descriptor; it is absent from the spec table and generates
// nothing.
syntax = "proto3";

package petstore.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/activatedio/tfinfra/examples/petstore/gen/petstore/v1;petstorev1";

// PetStoreService is AIP-shaped: Get/List/Create/Update/Patch/Delete with
// name/parent/update_mask, mirroring the surfaces tfinfra targets.
service PetStoreService {
  rpc GetPet(GetPetRequest) returns (Pet);
  rpc ListPets(ListPetsRequest) returns (ListPetsResponse);
  rpc CreatePet(CreatePetRequest) returns (Pet);
  rpc UpdatePet(UpdatePetRequest) returns (Pet);
  rpc PatchPet(PatchPetRequest) returns (Pet);
  rpc DeletePet(DeletePetRequest) returns (google.protobuf.Empty);

  // Toy is the caller-named counterpart of Pet: same AIP family, but the
  // create request carries the caller's own id in the entity's name field.
  rpc GetToy(GetToyRequest) returns (Toy);
  rpc ListToys(ListToysRequest) returns (ListToysResponse);
  rpc CreateToy(CreateToyRequest) returns (Toy);
  rpc UpdateToy(UpdateToyRequest) returns (Toy);
  rpc PatchToy(PatchToyRequest) returns (Toy);
  rpc DeleteToy(DeleteToyRequest) returns (google.protobuf.Empty);

  // The association RPC family, kit-shaped: an authoritative set/remove
  // edge plus its paginated read-back.
  rpc AssociateToysToPet(AssociateToysToPetRequest) returns (google.protobuf.Empty);
  rpc ListToysByPet(ListToysByPetRequest) returns (ListToysByPetResponse);
}

message GetPetRequest {
  string name = 1;
}

message ListPetsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
}

message ListPetsResponse {
  repeated Pet pets = 1;
  string next_page_token = 2;
}

message CreatePetRequest {
  string parent = 1;
  Pet pet = 2;
}

message UpdatePetRequest {
  string name = 1;
  Pet pet = 2;
}

message PatchPetRequest {
  string name = 1;
  Pet pet = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeletePetRequest {
  string name = 1;
}

enum PetType {
  PET_TYPE_UNSPECIFIED = 0;
  PET_TYPE_DOG = 1;
  PET_TYPE_CAT = 2;
}

message Pet {
  // AIP resource name: stores/{store}/pets/{pet}. Server-assigned.
  string name = 1;
  string display_name = 2;
  PetType type = 3;
  int32 age = 4;
  bool vaccinated = 5;
  double weight = 6;
  repeated string tags = 7;
  map<string, string> labels = 8;
  google.protobuf.Timestamp create_time = 9;
  // Typed config packed as Any; see CollarConfig and its generated config
  // data source.
  google.protobuf.Any config = 10;
  google.protobuf.Struct metadata = 11;
  // A singular nested message: the typed nested attribute lane, as opposed
  // to the protojson lane config/metadata take.
  Feeding feeding = 12;

  // Input only, and only on create: the shelter intake parameters. The
  // server consumes them to place the animal and never echoes them back on
  // a read — age and weight above are the answers, read from what was
  // actually recorded.
  string intake_code = 13;
  int32 intake_age_days = 14;
}

// Feeding is a singular nested message surfaced as a typed nested
// attribute. Its own fields cover the scalar, list and map shapes; a
// message inside it would not be supported (nesting is one level deep).
message Feeding {
  string schedule = 1;
  int32 portions = 2;
  repeated string foods = 3;
  map<string, string> notes = 4;
}

// CollarConfig is a concrete config type packed into Pet.config; it gets a
// generated builder data source exposing its Any encoding.
message CollarConfig {
  string color = 1;
  int32 size = 2;
  // Declared in the JSON list: the protojson lane.
  Buckle buckle = 3;
  // Left out of the JSON list: the typed nested attribute lane. Both lanes
  // coexist on one message.
  Engraving engraving = 4;
}

message Engraving {
  string text = 1;
  string font = 2;
  repeated string lines = 3;
}

message Buckle {
  string material = 1;
}

// AssociationRequest mirrors the kit association edge payload.
message AssociationRequest {
  repeated string set = 1;
  repeated string remove = 2;
}

message AssociateToysToPetRequest {
  string name = 1;
  AssociationRequest association = 2;
}

message ListToysByPetRequest {
  string name = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
}

message ListToysByPetResponse {
  repeated Toy toys = 1;
  string next_page_token = 2;
}

message GetToyRequest {
  string name = 1;
}

message ListToysRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListToysResponse {
  repeated Toy toys = 1;
  string next_page_token = 2;
}

message CreateToyRequest {
  string parent = 1;
  Toy toy = 2;
}

message UpdateToyRequest {
  string name = 1;
  Toy toy = 2;
}

message PatchToyRequest {
  string name = 1;
  Toy toy = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteToyRequest {
  string name = 1;
}

// Kennel exists for the generator's own tests: its collar field reaches a
// message (Buckle, inside CollarConfig) two levels down, which is one level
// deeper than typed nested attributes go. Nothing generates from it.
message Kennel {
  string name = 1;
  CollarConfig collar = 2;
}

// Toy is the association target entity and the caller-named resource: its
// AIP name is stores/{store}/toys/{toy}, where {toy} is the id the caller
// puts in name on create rather than one the server mints.
message Toy {
  string name = 1;
  string display_name = 2;
}
